name: Telegram Deal Test

on:
  workflow_dispatch:

jobs:
  send-test-deal:
    runs-on: ubuntu-latest

    steps:
      - name: Send test deal to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" -d "chat_id=${CHANNEL_ID}" --data-urlencode "text=🔥 Deal Discounter Test Deal - Our Telegram automation is working! 🚀"
